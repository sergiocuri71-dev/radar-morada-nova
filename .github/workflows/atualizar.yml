name: Atualizar o Radar

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 06:17 UTC (03:17 em Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["coletor/**", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # só para guardar os dados no repositório
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor de PDF e OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Coletar dados na Câmara
        if: github.event_name != 'push'
        run: |
          mkdir -p novo
          python3 coletor/coletar.py novo/data.json

      - name: Conferir a coleta (se vier estranha, para aqui e não publica)
        if: github.event_name != 'push'
        run: |
          python3 coletor/verificar.py dados/data.json novo/data.json
          mv novo/data.json dados/data.json

      - name: Coletar receitas e despesas (Tesouro Nacional / Siconfi)
        if: github.event_name != 'push'
        run: python3 coletor/financas.py dados/financas.json

      - name: Quem recebeu (portais de transparência da Prefeitura e da Câmara)
        if: github.event_name != 'push'
        timeout-minutes: 25
        run: python3 coletor/pagamentos.py dados/pagamentos.json dados/empenhos_cache.json

      - name: Coletar informações da cidade (IBGE e telefones úteis)
        if: github.event_name != 'push'
        run: python3 coletor/cidade.py dados/cidade.json

      - name: Ler as atas (OCR só das atas novas)
        run: python3 coletor/atas.py dados/atas dados/ausencias.json

      - name: Montar a página
        run: python3 coletor/montar.py dados _site/index.html

      - name: Outras cidades em teste (Abaeté e Três Marias) — se falhar, não atrapalha Morada Nova
        continue-on-error: true
        timeout-minutes: 40
        env:
          COLETAR: ${{ github.event_name != 'push' }}
        run: |
          for c in abaete tres-marias; do
            export CIDADE=$c
            mkdir -p dados/$c novo/$c _site/$c
            if [ "$COLETAR" = "true" ]; then
              if python3 coletor/coletar.py novo/$c/data.json && python3 coletor/verificar.py dados/$c/data.json novo/$c/data.json; then
                mv novo/$c/data.json dados/$c/data.json
              else
                echo "AVISO: coleta de $c suspeita ou incompleta; mantida a última versão boa"
              fi
              python3 coletor/financas.py dados/$c/financas.json || echo "AVISO: finanças de $c"
              python3 coletor/cidade.py dados/$c/cidade.json || echo "AVISO: IBGE de $c"
            fi
            [ -f dados/$c/data.json ] || continue
            python3 coletor/atas.py dados/$c/atas dados/$c/ausencias.json || echo "AVISO: atas de $c"
            python3 coletor/montar.py dados/$c _site/$c/index.html || echo "AVISO: página de $c"
          done

      - name: Guardar os dados no repositório
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 15
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publicar no GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
